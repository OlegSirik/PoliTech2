spring:
  web:
    resources:
      add-mappings: false

server:
  port: ${PORT:8088}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        name: PT2SESSION
        http-only: true
        same-site: lax

politech2:
  api-url: ${POLITECH_API_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4201,http://127.0.0.1:4201,http://localhost:8088,http://127.0.0.1:8088}

logging:
  level:
    root: INFO
    ru.pt.politech2: INFO
