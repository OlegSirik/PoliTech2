services:
  politech2:
    image: olegsirik/politech2:latest
    container_name: politech2
    environment:
      PORT: "8088"
      POLITECH_API_URL: ${POLITECH_API_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/bff/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
