<pt-search-page
  title="Страховые продукты"
  subtitle="Продукты тенанта из PoliTechAPI. Открывается рабочая версия: dev, иначе прод."
  [breadcrumbs]="breadcrumbs"
  [columns]="columns"
  [rows]="rows()"
  [actions]="actions"
  [rowActions]="rowActions"
  [loading]="loading()"
  [(query)]="query"
  (action)="onAction($event)"
  (rowAction)="onRowAction($event)"
  (rowClick)="open($event)">
  <mat-form-field ptSearchFilters appearance="outline" subscriptSizing="dynamic" class="company-filter">
    <mat-label>Страховая компания</mat-label>
    <mat-select [ngModel]="companyId()" (ngModelChange)="onCompany($event)">
      <mat-option [value]="null">Все</mat-option>
      @for (company of companies(); track company.id) {
        <mat-option [value]="company.id">{{ company.name || company.code }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</pt-search-page>
