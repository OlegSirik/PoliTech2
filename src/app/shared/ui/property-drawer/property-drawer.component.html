<aside class="drawer" [attr.inert]="open() ? null : ''">
  <header class="drawer__header">
    <div>
      <h2>{{ title() }}</h2>
      @if (subtitle()) {
        <p>{{ subtitle() }}</p>
      }
    </div>
    <button mat-icon-button type="button" aria-label="Закрыть панель" (click)="closed.emit()">
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <div class="drawer__body">
    <ng-content />
  </div>
  <footer class="drawer__footer">
    <ng-content select="[ptDrawerFooter]" />
  </footer>
</aside>
